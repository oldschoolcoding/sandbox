const CHUNK_SIZE: usize = 500;

#[derive(Debug)]
enum AppError {
    Io(io::Error),
    Ssh(ssh2::Error),
    Regex(regex::Error),
    Zip(zip::result::ZipError),
    Grep(String),
    Other(String),
}
impl From<io::Error> for AppError { fn from(e: io::Error) -> Self { Self::Io(e) } }
impl From<ssh2::Error> for AppError { fn from(e: ssh2::Error) -> Self { Self::Ssh(e) } }
impl From<regex::Error> for AppError { fn from(e: regex::Error) -> Self { Self::Regex(e) } }
impl From<zip::result::ZipError> for AppError { fn from(e: zip::result::ZipError) -> Self { Self::Zip(e) } }

#[derive(Clone)]
struct FileEntry { path: PathBuf, is_dir: bool }

trait FS: Send + Sync {
    fn read_dir(&self, p: &Path) -> Result<Vec<FileEntry>, AppError>;
    fn path_str(&self, p: &Path) -> String;
    fn open(&self, p: &Path) -> Result<Box<dyn Read>, AppError>;
    fn head(&self, p: &Path) -> Result<Vec<u8>, AppError>;
    fn chunk(&self, p: &Path, start: usize, n: usize) -> Result<Vec<String>, AppError>;
    fn is_local(&self) -> bool;
}

struct LocalFS;
impl FS for LocalFS {
    fn read_dir(&self, p: &Path) -> Result<Vec<FileEntry>, AppError> {
        Ok(fs::read_dir(p)?.filter_map(|e| e.ok()).map(|e| FileEntry { path: e.path(), is_dir: e.path().is_dir() }).collect())
    }
    fn path_str(&self, p: &Path) -> String { p.display().to_string() }
    fn open(&self, p: &Path) -> Result<Box<dyn Read>, AppError> { Ok(Box::new(File::open(p)?)) }
    fn head(&self, p: &Path) -> Result<Vec<u8>, AppError> {
        let mut f = File::open(p)?; let mut b = vec![0; 512]; let n = f.read(&mut b)?; b.truncate(n); Ok(b)
    }
    fn chunk(&self, p: &Path, start: usize, n: usize) -> Result<Vec<String>, AppError> {
        let lines: Vec<String> = BufReader::new(File::open(p)?).lines().skip(start).take(n).collect::<Result<_, _>>()?;
        Ok(lines)
    }
    fn is_local(&self) -> bool { true }
}

struct SftpFS { sftp: Sftp, host: String }
impl SftpFS {
    fn new(user: &str, host_port: &str, pass: &str) -> Result<Self, AppError> {
        let tcp = TcpStream::connect(if host_port.contains(':') { host_port } else { &format!("{host_port}:22") })?;
        let mut sess = Session::new()?; sess.set_tcp_stream(tcp); sess.handshake()?;
        sess.userauth_password(user, pass)?;
        if !sess.authenticated() { return Err(AppError::Other("Auth failed".into())); }
        let sftp = sess.sftp()?;
        let host = host_port.split(':').next().unwrap_or(host_port).to_string();
        Ok(Self { sftp, host })
    }
}
impl FS for SftpFS {
    fn read_dir(&self, p: &Path) -> Result<Vec<FileEntry>, AppError> {
        Ok(self.sftp.readdir(p)?.into_iter().map(|(p, s)| FileEntry { path: p, is_dir: s.is_dir() }).collect())
    }
    fn path_str(&self, p: &Path) -> String { format!("[{}]:{}", self.host, p.display()) }
    fn open(&self, p: &Path) -> Result<Box<dyn Read>, AppError> { Ok(Box::new(self.sftp.open(p)?)) }
    fn head(&self, p: &Path) -> Result<Vec<u8>, AppError> {
        let mut f = self.sftp.open(p)?; let mut b = vec![0; 512]; let n = f.read(&mut b)?; b.truncate(n); Ok(b)
    }
    fn chunk(&self, p: &Path, start: usize, n: usize) -> Result<Vec<String>, AppError> {
        let lines: Vec<String> = BufReader::new(self.sftp.open(p)?).lines().skip(start).take(n).collect::<Result<_, _>>()?;
        Ok(lines)
    }
    fn is_local(&self) -> bool { false }
}

#[derive(PartialEq)] enum Mode { Normal, Search, Help }
#[derive(PartialEq)] enum SearchKind { Name, Content }

struct App {
    fs: Box<dyn FS>,
    path: PathBuf,
    entries: Vec<FileEntry>,
    list: ListState,
    status: String,
    content: Vec<Line<'static>>,
    mode: Mode,
    query: String,
    results: Vec<Line<'static>>,
    result_idx: Option<usize>,
    searching: bool,
    abort: Arc<AtomicBool>,
}

impl App {
    fn new(fs: Box<dyn FS>) -> Result<Self, AppError> {
        let mut app = Self {
            fs, path: PathBuf::from("."), entries: vec![], list: ListState::default(),
            status: "".into(), content: vec![], mode: Mode::Normal, query: "".into(),
            results: vec![], result_idx: None, searching: false,
            abort: Arc::new(AtomicBool::new(false)),
        };
        app.refresh()?;
        Ok(app)
    }

    fn refresh(&mut self) -> Result<(), AppError> {
        self.entries = self.fs.read_dir(&self.path)?;
        self.entries.sort_by(|a, b| b.is_dir.cmp(&a.is_dir).then_with(|| a.path.file_name().unwrap().to_string_lossy().to_lowercase()
            .cmp(&b.path.file_name().unwrap().to_string_lossy().to_lowercase())));
        if self.entries.is_empty() { self.list.select(None); } else { self.list.select(Some(self.list.selected().map(|i| i.min(self.entries.len()-1)).unwrap_or(0))); }
        self.update_preview();
        Ok(())
    }

    fn update_preview(&mut self) {
        self.content = if let Some(i) = self.list.selected() {
            if let Some(e) = self.entries.get(i) {
                if e.is_dir { vec![Line::from("Directory")] }
                else { self.fs.chunk(&e.path, 0, CHUNK_SIZE).unwrap_or_default().into_iter().map(Line::from).collect() }
            } else { vec![] }
        } else { vec![Line::from("Select a file")] };
    }

    fn nav_up(&mut self) {
        if let Some(i) = self.list.selected() {
            self.list.select(Some(if i == 0 { self.entries.len().wrapping_sub(1) } else { i - 1 }));
            self.update_preview();
        }
    }
    fn nav_down(&mut self) {
        if let Some(i) = self.list.selected() {
            self.list.select(Some((i + 1) % self.entries.len()));
            self.update_preview();
        }
    }
    fn enter(&mut self) -> Result<(), AppError> {
        if let Some(i) = self.list.selected() {
            if self.entries[i].is_dir {
                self.path = self.entries[i].path.clone();
                self.refresh()?;
            }
        }
        Ok(())
    }
    fn back(&mut self) -> Result<(), AppError> {
        if self.path.parent().is_some() {
            self.path.pop();
            self.refresh()?;
        }
        Ok(())
    }

    fn download_zip(&mut self) -> Result<(), AppError> {
        // (unchanged from previous version - omitted for brevity)
        Ok(())
    }

    fn start_search(&mut self, kind: SearchKind) {
        self.abort.store(true, Ordering::Relaxed);
        self.abort = Arc::new(AtomicBool::new(false));
        self.mode = Mode::Search;
        self.query.clear();
        self.results.clear();
        self.result_idx = None;
        self.searching = true;
        self.status = format!("Search {}: ", if kind == SearchKind::Content { "content" } else { "name" });
    }

    fn trigger_search(&mut self) {
        if self.query.is_empty() {
            self.results.clear(); self.result_idx = None; self.searching = false; return;
        }

        let query = self.query.clone();
        let kind = if self.status.contains("content") { SearchKind::Content } else { SearchKind::Name };
        let path = self.path.clone();
        let fs = unsafe { std::mem::transmute::<&dyn FS, &'static dyn FS>(&*self.fs) };
        let abort = self.abort.clone();
        let results = Arc::new(std::sync::Mutex::new(vec![]));

        thread::spawn(move || {
            let _ = fast_search(fs, &path, &query, kind == SearchKind::Content, abort, results);
        });
    }

    fn next_result(&mut self) { if !self.results.is_empty() { self.result_idx = Some((self.result_idx.map(|i| i + 1).unwrap_or(0)) % self.results.len()); }}
    fn prev_result(&mut self) { if !self.results.is_empty() { self.result_idx = Some(self.result_idx.map(|i| if i == 0 { self.results.len() - 1 } else { i - 1 }).unwrap_or(self.results.len() - 1)); }}
    fn clear_results(&mut self) { self.results.clear(); self.query.clear(); self.result_idx = None; self.searching = false; }
}

// Fast search using ignore + grep (with full gitignore support on local)
fn fast_search(
    fs: &dyn FS,
    root: &Path,
    query: &str,
    content: bool,
    abort: Arc<AtomicBool>,
    out: Arc<std::sync::Mutex<Vec<Line<'static>>>>,
) -> Result<(), AppError> {
    if !fs.is_local() {
        // Fallback for SFTP
        return old_manual_search(fs, root, query, content, abort, out);
    }

    let re = Regex::new(&format!("(?i){}", regex::escape(query)))?;

    if content {
        let matcher = RegexMatcher::new_line_matcher(&format!("(?i){}", regex::escape(query)))?;
        let mut searcher = SearcherBuilder::new().line_number(true).build();

        struct Printer {
            out: Arc<std::sync::Mutex<Vec<Line<'static>>>>,
            abort: Arc<AtomicBool>,
        }
        impl Sink for Printer {
            type Error = SinkError;
            fn matched(&mut self, _searcher: &grep::searcher::Searcher, mat: &SinkMatch) -> Result<bool, Self::Error> {
                if self.abort.load(Ordering::Relaxed) { return Ok(false); }
                let path = std::str::from_utf8(mat.path())?.to_string();
                let line_num = mat.line_number().unwrap_or(0) as usize;
                let text = std::str::from_utf8(mat.bytes())?;
                let highlighted = highlight_line(&path, line_num, text, &re);
                self.out.lock().unwrap().push(highlighted);
                Ok(true)
            }
        }

        let printer = Printer { out: out.clone(), abort: abort.clone() };

        let walker = WalkBuilder::new(root)
            .git_ignore(true)      // <<< GITIGNORE SUPPORT
            .git_global(true)
            .git_exclude(true)
            .hidden(false)         // We still search hidden if not ignored by gitignore
            .build_parallel();

        walker.run(|| {
            let matcher = matcher.clone();
            let mut searcher = searcher.clone();
            Box::new(move |entry| {
                if abort.load(Ordering::Relaxed) { return WalkState::Quit; }
                let entry = match entry { Ok(e) => e, Err(_) => return WalkState::Continue };
                if entry.depth() == 0 { return WalkState::Continue; }
                if entry.file_type().map_or(false, |ft| ft.is_dir()) { return WalkState::Continue; }
                if entry.metadata().map_or(false, |m| m.len() > 200_000) { return WalkState::Continue; }

                let _ = searcher.search_path(&matcher, entry.path(), printer.clone());
                WalkState::Continue
            })
        });
    } else {
        // Name search with gitignore
        let walker = WalkBuilder::new(root)
            .git_ignore(true)
            .git_global(true)
            .git_exclude(true)
            .hidden(false)
            .build_parallel();

        walker.run(|| Box::new(move |entry| {
            if abort.load(Ordering::Relaxed) { return WalkState::Quit; }
            let entry = match entry { Ok(e) => e, Err(_) => return WalkState::Continue };
            if entry.depth() == 0 { return WalkState::Continue; }
            let name = entry.file_name().to_string_lossy();
            if re.is_match(&name) {
                let full = entry.path().display().to_string();
                let line = if entry.file_type().map_or(false, |ft| ft.is_dir()) {
                    Line::from(vec![Span::styled(format!("{}/", full), Style::default().fg(Color::Cyan).bold())])
                } else {
                    Line::from(highlight(&full, &re))
                };
                out.lock().unwrap().push(line);
            }
            WalkState::Continue
        }));
    }
    Ok(())
}

