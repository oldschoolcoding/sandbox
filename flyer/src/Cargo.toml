fn highlight(text: &str, re: &Regex) -> Vec<Span<'static>> {
    let mut spans = vec![];
    let mut last = 0;
    for m in re.find_iter(text) {
        spans.push(Span::raw(text[last..m.start()].to_string()));
        spans.push(Span::styled(text[m.range()].to_string(), Style::default().fg(Color::Red).bold()));
        last = m.end();
    }
    spans.push(Span::raw(text[last..].to_string()));
    spans
}

fn highlight_line(path: &str, ln: usize, line: &str, re: &Regex) -> Line<'static> {
    let mut spans = vec![Span::styled(format!("{}:{:4}: ", path, ln), Style::default().fg(Color::Yellow))];
    let mut last = 0;
    for m in re.find_iter(line) {
        spans.push(Span::raw(line[last..m.start()].to_string()));
        spans.push(Span::styled(line[m.range()].to_string(), Style::default().fg(Color::Red).bg(Color::DarkGray).bold()));
        last = m.end();
    }
    spans.push(Span::raw(line[last..].to_string()));
    Line::from(spans)
}

