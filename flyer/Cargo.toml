[package]
name = "flyer"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
ssh2 = "0.9"
thiserror = "1.0"
chrono = "0.4"
infer = "0.15"
users = "0.11"
regex = "1.10"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
indicatif = "0.17"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }