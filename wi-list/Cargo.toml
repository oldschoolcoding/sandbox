[package]
name = "wi-list"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
base64 = "0.21"
futures = "0.3"
clap = { version = "4.0.0-rc.3" }
indicatif = "0.17"

